<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!--
  FONTE EDITÁVEL da imagem de preview de link (1200 × 630).
  Para gerar publico/og-image-rn-pb.png: node ferramentas/gerar_imagens.mjs
  O mapa do RN e da PB (marcador MAPA no svg abaixo) é desenhado a partir da malha oficial do IBGE, colorido pela
  população do Censo 2022 — dado real. Se mudar a imagem, troque o nome do arquivo final
  (ex.: og-image-v3.png) porque o WhatsApp guarda o preview em cache.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; }
  body { width:1200px; height:630px; overflow:hidden; background:#0b1b3a; color:#fff;
    font-family:Inter, system-ui, sans-serif; position:relative; }
  .texto { position:absolute; left:72px; top:64px; width:580px; }
  .logo { display:flex; align-items:center; gap:14px; font-weight:800; font-size:30px; letter-spacing:-.02em; }
  .logo svg { width:52px; height:52px; }
  h1 { font-size:52px; line-height:1.08; letter-spacing:-.035em; font-weight:800; margin:56px 0 18px; }
  .ufs { display:flex; gap:10px; margin:0 0 20px; }
  .ufs span { font-size:20px; font-weight:800; letter-spacing:.06em; padding:5px 16px; border-radius:999px; background:rgba(79,143,224,.2); color:#cde2fb; border:1px solid rgba(134,182,239,.5); }
  p { font-size:24px; line-height:1.4; color:#c7d4ec; margin:0; }
  .credito { position:absolute; left:72px; bottom:52px; font-size:20px; color:#a9b8d6; }
  .credito b { color:#fff; font-weight:600; }
  .mapa { position:absolute; right:24px; top:40px; width:540px; }
  .mapa path.mun { stroke:#0b1b3a; stroke-width:.6px; vector-effect:non-scaling-stroke; }
  .mapa path.divisa { fill:none; stroke:#cde2fb; stroke-width:2.2px; vector-effect:non-scaling-stroke; stroke-linecap:round; }
  .mapa text.uf { font-size:5px; font-weight:800; fill:#fff; stroke:#0b1b3a; stroke-width:1.2px; paint-order:stroke; text-anchor:middle; dominant-baseline:middle; letter-spacing:.05em; }
  .legenda { position:absolute; right:56px; bottom:52px; font-size:15px; color:#8fa3c8; }
</style>
</head>
<body>
  <div class="texto">
    <div class="logo">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1f5fd6"/><path d="M32 53s-15-13.2-15-25.5a15 15 0 1 1 30 0C47 39.8 32 53 32 53z" fill="#fff"/><circle cx="32" cy="27.5" r="6" fill="#1f5fd6"/></svg>
      MapaLeads
    </div>
    <h1>Prospecção B2B inteligente<br>no RN e na PB</h1>
    <div class="ufs"><span>RN</span><span>PB</span></div>
    <p>Empresas por cidade, microrregião e segmento — com WhatsApp, mapa e dados do IBGE.</p>
  </div>
  <svg class="mapa" viewBox="0 0 100 60" aria-hidden="true"><!-- MAPA --></svg>
  <div class="credito">Desenvolvido por <b>Resolve Farma</b></div>
  <div class="legenda">Mapa: população por município · IBGE, Censo 2022</div>
</body>
</html>
