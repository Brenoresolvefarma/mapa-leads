# TEMPORÁRIO (removido antes do merge): roda "Testar tela em produção" no deploy preview do PR 9
# com as Functions deste commit no runner (api_local), porque workflow_dispatch só vale na main. (tentativa 5)
name: TMP testar preview
on:
  push:
    branches: [claude/great-darwin-pt5gmw]
    paths: [.github/workflows/tmp-testar-preview.yml]
permissions:
  contents: read
  actions: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node testes/empacotar.mjs
      - name: Esperar o deploy preview publicar a tela nova
        run: |
          for i in $(seq 1 60); do
            if curl -fsS https://deploy-preview-9--mapaleads-rn.netlify.app/dados/microrregioes_rn.json -o /dev/null; then echo "preview pronto"; exit 0; fi
            sleep 10
          done
          echo "preview não ficou pronto"; exit 1
      - name: Testar a tela (preview + Functions deste commit)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODO: so_tela
          NAVEGADOR: /usr/bin/google-chrome
          API_LOCAL: "1"
          MAPALEADS_GITHUB_TOKEN: ${{ github.token }}
          MAPALEADS_GITHUB_REPO: ${{ github.repository }}
        run: node ferramentas/testar_tela_producao.mjs https://deploy-preview-9--mapaleads-rn.netlify.app
