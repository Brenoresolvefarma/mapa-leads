# TEMPORÁRIO (removido antes do merge): "Testar tela em produção" no deploy preview do PR 11
# com as Functions deste commit no runner (api_local), porque workflow_dispatch só vale na main.
name: TMP testar preview
on:
  push:
    branches: [claude/great-darwin-pt5gmw]
    paths: [.github/workflows/tmp-testar-preview.yml]
permissions:
  contents: read
  actions: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: node testes/empacotar.mjs
      - name: Esperar o deploy preview com a tela nova
        run: |
          for i in $(seq 1 60); do
            if curl -fsS https://deploy-preview-11--mapaleads-rn.netlify.app/ | grep -q 'id="f-segmento"'; then echo "preview pronto"; exit 0; fi
            sleep 10
          done
          exit 1
      - name: Testar a tela (preview + Functions deste commit)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODO: so_tela
          NAVEGADOR: /usr/bin/google-chrome
          API_LOCAL: "1"
          MAPALEADS_GITHUB_TOKEN: ${{ github.token }}
          MAPALEADS_GITHUB_REPO: ${{ github.repository }}
        run: node ferramentas/testar_tela_producao.mjs https://deploy-preview-11--mapaleads-rn.netlify.app
