# Testes a cada push e PR (grátis em repo público). Só dados fictícios.
#  - pytest: tratamento, vigia e fila do motor;
#  - node: lógica das Netlify Functions (limite diário, RN inteiro, fila);
#  - emuladores do Firebase: regras de segurança do Firestore, Functions (login + banco)
#    o motor inteiro com scraper falso e a TELA no Chrome. Nada disso toca no Firebase de verdade.
name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r motor/requirements.txt -r motor/requirements-dev.txt
      - working-directory: motor
        run: pytest -q

  node-e-emuladores:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install -r motor/requirements.txt -r motor/requirements-dev.txt
      - name: Lógica das Functions
        run: npm test
      - name: Regras do Firestore (emulador)
        run: npm run test:regras
      - name: Functions contra os emuladores (Auth + Firestore)
        run: npm run test:funcoes
      - name: Functions EMPACOTADAS como no Netlify, sem require() de ES Module (runtime de produção)
        run: npm run test:empacotadas
      - name: Motor contra o emulador (scraper falso)
        run: npm run test:motor
      - name: Tela no Chrome contra os emuladores (inclui a planilha .xlsx gerada e lida de volta com o ExcelJS)
        env:
          NAVEGADOR: /usr/bin/google-chrome
        run: npm run test:tela
      - name: Tema no WebKit (motor do Safari do iPhone)
        env:
          MOTOR: webkit
        run: |
          npx --yes playwright@1.63.0 install --with-deps webkit
          npx firebase emulators:exec --only firestore,auth --project demo-mapaleads "node --test --test-concurrency=1 --test-name-pattern='^(tema|comemoração)' testes/tela.test.mjs"
