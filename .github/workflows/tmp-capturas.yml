# TEMPORÁRIO (removido antes do merge): capturas da Etapa 0 no deploy preview do PR 10.
#  - públicas (login comum temporário, sem leads): vão para docs/capturas/etapa0/ no PR;
#  - privadas (admin temporário, leads reais sem tarja): criptografadas com a chave pública
#    ferramentas/marca/chave_publica_capturas_tmp.pem (a privada só existe na sessão do Claude)
#    e publicadas cifradas na branch tmp-capturas-privadas. Nada legível sai do runner.
name: TMP capturas etapa 0
on:
  push:
    branches: [claude/great-darwin-pt5gmw]
    paths: [.github/workflows/tmp-capturas.yml]
permissions:
  contents: write
concurrency: { group: tmp-capturas, cancel-in-progress: true }
jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW: https://deploy-preview-10--mapaleads-rn.netlify.app
      NAVEGADOR: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Esperar o deploy preview deste commit
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$PREVIEW/prototipo.html" | grep -q "Etapa 0" && curl -fsS -o /dev/null "$PREVIEW/dados/malha_rn_municipio_minima.geojson.json"; then
              echo "preview pronto; config-publica HTTP $(curl -s -o /dev/null -w '%{http_code}' $PREVIEW/api/config-publica)"; exit 0; fi
            sleep 10
          done
          exit 1
      - name: Imagens da marca (og-image e ícones) com a fonte Inter
        run: node ferramentas/gerar_imagens.mjs
      - name: Capturas públicas (usuário comum temporário, sem leads)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node ferramentas/capturar_telas.mjs "$PREVIEW"
      - name: Capturas privadas (leads reais) — criptografadas antes de sair do runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PAPEL: admin
          SEM_TARJA: "1"
          PASTA_CAPTURAS: ${{ runner.temp }}/privadas
        run: |
          node ferramentas/capturar_telas.mjs "$PREVIEW" > /dev/null
          cd "$RUNNER_TEMP"
          tar -czf privadas.tgz privadas && rm -rf privadas
          openssl rand -out chave.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in privadas.tgz -out privadas.tgz.enc -pass file:chave.bin
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/ferramentas/marca/chave_publica_capturas_tmp.pem" \
            -pkeyopt rsa_padding_mode:oaep -in chave.bin -out chave.bin.enc
          rm -f privadas.tgz chave.bin
          mkdir cifrado && mv privadas.tgz.enc chave.bin.enc cifrado/
          cd cifrado && git init -q -b tmp-capturas-privadas
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "capturas privadas cifradas (temporário)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-capturas-privadas
          echo "capturas privadas publicadas CIFRADAS"
      - name: Guardar capturas públicas e imagens no PR
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/capturas/etapa0 publico/og-image.png publico/favicon-32.png publico/apple-touch-icon.png publico/icone-192.png publico/icone-512.png
          git commit -m "Capturas da Etapa 0 (publicas, sem leads) e imagens da marca" || echo "nada novo"
          git push
