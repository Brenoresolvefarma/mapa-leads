# TEMPORÁRIO (removido antes do merge): confere fontes do IBGE e grava as malhas do RN.
name: TMP fontes IBGE
on:
  push:
    branches: [claude/great-darwin-pt5gmw]
    paths: [ferramentas/tmp_ibge_fontes.py]
permissions:
  contents: write
jobs:
  ibge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: python3 ferramentas/tmp_ibge_fontes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/malha_rn_*.json
          git commit -m "Dados IBGE: malhas do RN (municipios, microrregioes, regioes imediatas)" || echo "nada novo"
          git push
