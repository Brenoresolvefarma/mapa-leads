# Capturas da tela no site publicado (manual): login TEMPORÁRIO + busca com leads FICTÍCIOS (tudo apagado no fim).
# As imagens vão para a branch "capturas-tela" (sobrescrita a cada rodada), nunca para a main.
# Nenhum dado real de lead aparece: é um usuário comum novo, só com a busca de exemplo.
# Uso: Actions > Capturas da tela > Run workflow (conjunto "celular" = 390/360 px, claro e escuro).
name: Capturas da tela

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL do site"
        required: true
        default: "https://mapaleads-rn.netlify.app"
      conjunto:
        description: "celular (390/360, claro e escuro), completo (computador + celular), crm-pb (status, carteira, mapa e Mercado da PB) ou comemoracao (mede e grava a comemoração ao criar busca; criação simulada)"
        required: true
        default: "celular"
        type: choice
        options:
          - celular
          - completo
          - crm-pb
          - comemoracao

permissions:
  contents: write

concurrency: { group: capturas, cancel-in-progress: true }

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Capturas (login temporário + busca fictícia)
        if: github.event.inputs.conjunto != 'crm-pb' && github.event.inputs.conjunto != 'comemoracao'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NAVEGADOR: /usr/bin/google-chrome
          SEMEAR: "1"
          CONJUNTO: ${{ github.event.inputs.conjunto == 'celular' && 'celular' || '' }}
          PASTA_CAPTURAS: ${{ runner.temp }}/capturas
        run: node ferramentas/capturar_telas.mjs "${{ github.event.inputs.url }}"
      - name: Capturas do CRM, carteira e PB (2 logins temporários + dados fictícios, tudo apagado no fim)
        if: github.event.inputs.conjunto == 'crm-pb'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NAVEGADOR: /usr/bin/google-chrome
          PASTA_CAPTURAS: ${{ runner.temp }}/capturas
        run: node testes/capturas-crm-pb.mjs "${{ github.event.inputs.url }}"
      - name: Comemoração no ar (vendedor novo com vídeo + master só com números; criação simulada, nada na fila)
        if: github.event.inputs.conjunto == 'comemoracao'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NAVEGADOR: /usr/bin/google-chrome
          PASTA_CAPTURAS: ${{ runner.temp }}/capturas
        run: |
          npx playwright-core install ffmpeg
          node ferramentas/diagnosticar_comemoracao.mjs "${{ github.event.inputs.url }}"
      - name: Vídeos da comemoração em GIF
        if: always() && github.event.inputs.conjunto == 'comemoracao'
        run: |
          cd "$RUNNER_TEMP/capturas" || exit 0
          for v in *.webm; do
            [ -f "$v" ] || continue
            ffmpeg -loglevel error -y -i "$v" -vf "fps=15,scale='min(720,iw)':-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128[p];[b][p]paletteuse" "${v%.webm}.gif"
          done
          ls -la
      - name: Publicar na branch capturas-tela
        if: always()
        run: |
          cd "$RUNNER_TEMP/capturas" || exit 0
          git init -q -b capturas-tela
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Capturas da tela (dados fictícios)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas-tela
          echo "capturas publicadas na branch capturas-tela"
