# TEMPORÁRIO: coleta microrregiões e regiões imediatas do RN na API do IBGE. Removido antes do merge.
name: TMP regioes IBGE
on:
  push:
    branches: [claude/great-darwin-pt5gmw]
    paths: [ferramentas/tmp_regioes.py]
permissions:
  contents: write
jobs:
  ibge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 ferramentas/tmp_regioes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/microrregioes_rn.json
          git commit -m "Dados IBGE: microrregioes e regioes imediatas do RN"
          git push
