# TEMPORÁRIO (removido antes do merge): valida a tela v2 no deploy preview do PR 12.
#  1) teste real (logins temporários, busca fictícia, Functions deste commit no runner — API_LOCAL);
#  2) capturas públicas (login temporário + busca FICTÍCIA, tudo apagado): vão para docs/capturas/fase3a-v2/;
#  3) capturas privadas (admin temporário, leads reais sem tarja): criptografadas com a chave pública
#     ferramentas/marca/chave_publica_capturas_tmp.pem (a privada só existe na sessão do Claude) e publicadas
#     cifradas na branch tmp-capturas-privadas. Nada legível sai do runner.
name: TMP tela v2 no preview
on:
  push:
    branches: [claude/great-darwin-pt5gmw]
    paths: [.github/workflows/tmp-v2.yml, publico/index.html]
permissions:
  contents: write
concurrency: { group: tmp-v2, cancel-in-progress: true }
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW: https://deploy-preview-12--mapaleads-rn.netlify.app
      NAVEGADOR: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Esperar o deploy preview DESTE commit
        run: |
          # Pronto = todas as linhas do index.html deste commit estão no preview (o Netlify pode injetar outras).
          sort -u publico/index.html > "$RUNNER_TEMP/local.txt"
          for i in $(seq 1 90); do
            curl -fsS "$PREVIEW/" | sort -u > "$RUNNER_TEMP/remoto.txt" || true
            faltam=$(comm -23 "$RUNNER_TEMP/local.txt" "$RUNNER_TEMP/remoto.txt" | wc -l)
            if [ "$faltam" = "0" ] && curl -fsS -o /dev/null "$PREVIEW/dados/ibge_rn_indicadores.json"; then echo "preview pronto"; exit 0; fi
            sleep 10
          done
          echo "preview não ficou pronto"; exit 1
      - name: Empacotar as Functions como no Netlify
        run: node testes/empacotar.mjs
      - name: Teste real da tela no preview (API local)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          API_LOCAL: "1"
        run: node ferramentas/testar_tela_producao.mjs "$PREVIEW"
      - name: Capturas públicas (login temporário + busca fictícia)
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          API_LOCAL: "1"
          SEMEAR: "1"
        run: node ferramentas/capturar_telas.mjs "$PREVIEW"
      - name: Capturas privadas (leads reais) — criptografadas antes de sair do runner
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          API_LOCAL: "1"
          PAPEL: admin
          SEM_TARJA: "1"
          PASTA_CAPTURAS: ${{ runner.temp }}/privadas
        run: |
          node ferramentas/capturar_telas.mjs "$PREVIEW" > /dev/null || echo "capturas privadas com aviso (código $?)"
          cd "$RUNNER_TEMP"
          tar -czf privadas.tgz privadas && rm -rf privadas
          openssl rand -out chave.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in privadas.tgz -out privadas.tgz.enc -pass file:chave.bin
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/ferramentas/marca/chave_publica_capturas_tmp.pem" \
            -pkeyopt rsa_padding_mode:oaep -in chave.bin -out chave.bin.enc
          rm -f privadas.tgz chave.bin
          mkdir cifrado && mv privadas.tgz.enc chave.bin.enc cifrado/
          cd cifrado && git init -q -b tmp-capturas-privadas
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "capturas privadas cifradas (temporário)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-capturas-privadas
          echo "capturas privadas publicadas CIFRADAS"
      - name: Guardar capturas públicas no PR
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/capturas/fase3a-v2
          git commit -m "Capturas da tela v2 (públicas, dados fictícios)" || echo "nada novo"
          git pull --rebase -q origin claude/great-darwin-pt5gmw && git push
