# Motor do MapaLeads: roda o scraper do Google Maps e grava os leads no Firestore.
#
# Repositório PÚBLICO: os logs são visíveis para qualquer pessoa.
#  - o motor só imprime contagens e status (nunca dados de leads);
#  - nada de upload-artifact nem commit de resultados;
#  - arquivos temporários do scraper são apagados ao final.
name: Motor MapaLeads

on:
  workflow_dispatch:
    inputs:
      termos:
        description: "Termos de busca, separados por vírgula (ex.: home care, cuidador de idosos). Deixe vazio só para processar a fila."
        required: false
        type: string
      cidades:
        description: "Cidades, separadas por vírgula"
        required: false
        default: "Natal RN"
        type: string
      extrair_email:
        description: "Extrair e-mail (visita o site de cada lugar; deixa a busca ~2x mais lenta)"
        required: false
        default: false
        type: boolean
      profundidade:
        description: "Profundidade: rapida (~20 lugares por consulta), normal (~60), completa (até ~120)"
        required: false
        default: "normal"
        type: choice
        options:
          - rapida
          - normal
          - completa
      busca_id:
        description: "(Uso interno, Fase 2) ID de uma busca já criada na fila"
        required: false
        type: string

# Fila: só uma execução do motor por vez, e nunca cancelamos a que está rodando.
# O GitHub guarda só UMA execução pendente e descarta as outras, mas nenhuma
# busca se perde: todas ficam salvas no Firestore com status "na_fila" e o
# motor esvazia a fila inteira antes de terminar.
concurrency:
  group: mapaleads-motor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Versão FIXA do scraper (nunca "latest"). Para atualizar, troque aqui e em motor/motor.py.
      SCRAPER_IMAGE: gosom/google-maps-scraper:v1.18.1
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motor/requirements.txt

      - name: Instalar dependências
        run: pip install -r motor/requirements.txt

      - name: Baixar imagem do scraper
        run: docker pull -q "$SCRAPER_IMAGE"

      - name: Rodar motor
        working-directory: motor
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAPALEADS_ADMIN_UID: ${{ vars.MAPALEADS_ADMIN_UID }}
        run: python motor.py

      - name: Limpar arquivos temporários
        if: always()
        run: |
          # Encerra qualquer container do scraper que tenha sobrado.
          docker ps -q --filter "name=mapaleads-" | xargs -r docker kill > /dev/null 2>&1 || true
          sudo rm -rf /tmp/mapaleads-* "${RUNNER_TEMP:?}"/mapaleads-* || true
