# Motor do MapaLeads: roda o scraper do Google Maps e grava os leads no Firestore.
#
# Quem dispara:
#  - a Netlify Function (a cada busca criada), com o ID da busca;
#  - o agendamento a cada 15 min (rede de segurança da fila e RN agendado/pausado);
#  - o próprio motor, quando o tempo da execução acaba e ainda há fila;
#  - o admin, manualmente pelo "Run workflow" (formulário abaixo).
#
# Repositório PÚBLICO: os logs são visíveis para qualquer pessoa.
#  - o motor só imprime contagens e status (nunca dados de leads);
#  - nada de upload-artifact nem commit de resultados;
#  - arquivos temporários do scraper são apagados ao final.
name: Motor MapaLeads

on:
  schedule:
    # A cada 15 min (UTC). Com fila vazia, sai em segundos (grátis em repo público).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      termos:
        description: "Termos de busca, separados por vírgula (ex.: home care, cuidador de idosos). Deixe vazio só para processar a fila."
        required: false
        type: string
      cidades:
        description: "Cidades, separadas por vírgula"
        required: false
        default: "Natal RN"
        type: string
      extrair_email:
        description: "Extrair e-mail (visita o site de cada lugar; deixa a busca ~2x mais lenta)"
        required: false
        default: false
        type: boolean
      profundidade:
        description: "Profundidade: rapida (~20 lugares por consulta), normal (~60), completa (até ~120)"
        required: false
        default: "normal"
        type: choice
        options:
          - rapida
          - normal
          - completa
      busca_id:
        description: "(Uso interno) ID da busca criada pela tela; o motor processa a fila inteira"
        required: false
        type: string

# Paralelismo (aprovado pelo Breno em 24/09): cada disparo abre 4 "vagas" (jobs da matrix).
# Cada vaga tem o SEU grupo de concurrency: no total, nunca mais que 4 máquinas ao mesmo
# tempo, e nunca cancelamos a que está rodando. O GitHub guarda só UMA execução pendente
# por vaga e descarta as outras, mas nenhuma busca se perde: tudo fica no Firestore com
# status "na_fila" e cada vaga esvazia a fila antes de terminar. Vaga sem trabalho (ou
# desligada por sinal de bloqueio, ver motor/paralelismo.py) sai em segundos.

permissions:
  contents: read
  actions: write # para o motor disparar a próxima execução quando a fila não coube numa só

jobs:
  motor:
    strategy:
      fail-fast: false
      matrix:
        vaga: [1, 2, 3, 4]
    concurrency:
      group: mapaleads-motor-vaga-${{ matrix.vaga }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Versão FIXA do scraper (nunca "latest"). Para atualizar, troque aqui e em motor/motor.py.
      SCRAPER_IMAGE: gosom/google-maps-scraper:v1.18.1
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motor/requirements.txt

      - name: Instalar dependências
        run: pip install -r motor/requirements.txt

      - name: Rodar motor
        working-directory: motor
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # UID do admin agora é SECRET (não aparece no log público).
          MAPALEADS_ADMIN_UID: ${{ secrets.MAPALEADS_ADMIN_UID }}
          # Várias vagas ao mesmo tempo: busca "rodando" só é órfã sem sinal de vida (aprovado em 24/09).
          MOTOR_PARALELO: "true"
          MOTOR_VAGA: ${{ matrix.vaga }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python motor.py

      - name: Limpar arquivos temporários
        if: always()
        run: |
          # Encerra qualquer container do scraper que tenha sobrado.
          docker ps -q --filter "name=mapaleads-" | xargs -r docker kill > /dev/null 2>&1 || true
          sudo rm -rf /tmp/mapaleads-* "${RUNNER_TEMP:?}"/mapaleads-* || true
